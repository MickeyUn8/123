name: Run Telegram Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🛠 Install build tools
        run: |
          sudo apt update
          sudo apt install -y clang

      - name: 🔨 Build bgmi binary
        run: |
          echo "Compiling bgmi.c..."
          clang bgmi.c -o bgmi

          echo "Listing files:"
          ls -la

      - name: ✅ Make executable
        run: chmod +x bgmi

      - name: 🧪 Test binary
        run: |
          echo "Testing binary..."
          ./bgmi || echo "Binary executed (or needs args)"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI aiohttp pytz psutil requests

      - name: 🚀 Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python Danger.py
